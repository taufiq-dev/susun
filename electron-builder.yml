# Reverse domain of susun.tech. Windows' AppUserModelId (src/main/index.ts) must match it.
appId: tech.susun.app
productName: Susun
directories:
  buildResources: build
files:
  # Only what the app runs: the built code and its resources. electron-builder adds package.json and
  # the production dependencies itself.
  - out/**
  - resources/**
  # better-sqlite3 ships its C sources and a prebuilt binary for every platform, and loads only the
  # binary for its own. (A platform section's `files` would replace these patterns, not add to them.)
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/prebuilds/!(${platform}-*).node'
asarUnpack:
  - resources/**
win:
  executableName: susun
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Unsigned until Susun has its own Developer ID: without this, electron-builder signs with any
  # certificate it finds in the keychain.
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No auto-updates (electron-updater was removed), so no update files next to the packages.
publish: null
